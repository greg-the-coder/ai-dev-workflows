name: Open Pull Request
on:
  push:
    branches:
      - 'feature/add-cognito-api-gateway-auth'

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for existing PR
        id: check
        run: |
          PR_COUNT=$(gh pr list --head "feature/add-cognito-api-gateway-auth" --json number --jq length 2>/dev/null || echo "0")
          echo "count=$PR_COUNT" >> $GITHUB_OUTPUT
      - name: Create Pull Request
        if: steps.check.outputs.count == '0'
        run: |
          gh pr create \
            --title "Security: Add Cognito User Pool authentication to API Gateway" \
            --base master \
            --head feature/add-cognito-api-gateway-auth \
            --body "## Summary

          Security remediation adding authentication and authorization to all API Gateway endpoints:

          - **Cognito User Pool**: Added User Pool with email sign-in, strong password policy, and auto-verification
          - **Cognito User Pool Client**: Configured with USER_PASSWORD and USER_SRP auth flows
          - **API Gateway Authorizer**: CognitoUserPoolsAuthorizer applied to all endpoints (POST /tasks, GET /tasks, PUT /tasks/{taskId}, DELETE /tasks/{taskId}, GET /summary/*)
          - **CORS Restriction**: Replaced wildcard '*' origin with CloudFront distribution domain
          - **Lambda CORS Update**: All handlers now use ALLOWED_ORIGIN environment variable instead of hardcoded wildcard

          ## Test plan
          - [ ] CDK synth passes cleanly
          - [ ] All API methods require valid Cognito JWT in Authorization header
          - [ ] Unauthenticated requests return 401
          - [ ] CORS headers only allow CloudFront domain origin
          - [ ] OPTIONS preflight requests work correctly

          Generated with [Claude Code](https://claude.com/claude-code)"

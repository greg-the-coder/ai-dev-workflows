name: Create PR
on:
  push:
    branches:
      - 'feature/add-input-validation-and-rate-limiting'

permissions: write-all

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:feature/add-input-validation-and-rate-limiting`,
              state: 'open'
            });
            
            if (pulls.length > 0) {
              console.log(`PR already exists: #${pulls[0].number}`);
              return;
            }
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security: Add input validation, sanitization, and API rate limiting',
              head: 'feature/add-input-validation-and-rate-limiting',
              base: 'master',
              body: `## Summary\n\nSecurity remediation addressing Well-Architected Review findings:\n\n- **Backend Input Validation**: Max 500-char description, HTML tag stripping for XSS prevention, UUID v4 validation on taskId, sanitized error responses\n- **API Rate Limiting**: API Gateway throttling (50 req/s steady, 100 burst), write endpoint throttling (20 req/s), Lambda reserved concurrency, AWS WAF WebACL with AWSManagedRulesCommonRuleSet\n- **Frontend Hardening**: Content-Security-Policy meta tag, client-side input length validation\n\n## Test plan\n- [ ] CDK synth passes cleanly\n- [ ] Input validation returns 400 for oversized/malicious input\n- [ ] XSS payloads stripped\n- [ ] Invalid UUID taskIds rejected\n\nGenerated with [Claude Code](https://claude.com/claude-code)`
            });
            
            console.log(`PR created: ${pr.html_url}`);

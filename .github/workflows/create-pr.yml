name: Create PR
on:
  push:
    branches:
      - 'feature/add-cognito-api-gateway-auth'

permissions: write-all

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:feature/add-cognito-api-gateway-auth`,
              state: 'open'
            });

            if (pulls.length > 0) {
              console.log(`PR already exists: #${pulls[0].number}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security: Add Cognito User Pool authentication to API Gateway',
              head: 'feature/add-cognito-api-gateway-auth',
              base: 'master',
              body: `## Summary\n\nSecurity remediation adding authentication and authorization to all API Gateway endpoints:\n\n- **Cognito User Pool**: Added User Pool with email sign-in, strong password policy, and auto-verification\n- **Cognito User Pool Client**: Configured with USER_PASSWORD and USER_SRP auth flows\n- **API Gateway Authorizer**: CognitoUserPoolsAuthorizer applied to all endpoints (POST /tasks, GET /tasks, PUT /tasks/{taskId}, DELETE /tasks/{taskId}, GET /summary/*)\n- **CORS Restriction**: Replaced wildcard '*' origin with CloudFront distribution domain\n- **Lambda CORS Update**: All handlers now use ALLOWED_ORIGIN environment variable instead of hardcoded wildcard\n\n## Test plan\n- [ ] CDK synth passes cleanly\n- [ ] All API methods require valid Cognito JWT in Authorization header\n- [ ] Unauthenticated requests return 401\n- [ ] CORS headers only allow CloudFront domain origin\n- [ ] OPTIONS preflight requests work correctly\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)`
            });

            console.log(`PR created: ${pr.html_url}`);

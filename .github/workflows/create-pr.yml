name: Create PR for Security Remediation
on:
  push:
    branches:
      - 'feature/add-input-validation-and-rate-limiting'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh pr list --head feature/add-input-validation-and-rate-limiting --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "PR #$EXISTING already exists"
            exit 0
          fi
          gh pr create \
            --title "Security: Add input validation, sanitization, and API rate limiting" \
            --base master \
            --head feature/add-input-validation-and-rate-limiting \
            --body "## Summary
          
          Security remediation addressing Well-Architected Review findings:
          
          - **Backend Input Validation**: Added max 500-char description length, HTML tag stripping for XSS prevention, UUID v4 validation on taskId path parameters, sanitized error responses
          - **API Rate Limiting**: API Gateway throttling (50 req/s steady, 100 burst), method-level throttling on write endpoints (20 req/s), Lambda reserved concurrency, AWS WAF WebACL with AWSManagedRulesCommonRuleSet
          - **Frontend Hardening**: Content-Security-Policy meta tag, client-side input length validation
          
          ## Test plan
          - [ ] CDK synth passes cleanly
          - [ ] Input validation returns proper 400 errors
          - [ ] XSS payloads stripped from descriptions
          - [ ] Invalid UUID taskIds rejected
          - [ ] Rate limiting active under load
          
          Generated with [Claude Code](https://claude.com/claude-code)"

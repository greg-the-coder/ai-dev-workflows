name: Create PR
on:
  push:
    branches:
      - 'feature/add-input-validation-and-rate-limiting'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Pull Request via API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d '{
              "title": "Security: Add input validation, sanitization, and API rate limiting",
              "head": "feature/add-input-validation-and-rate-limiting",
              "base": "master",
              "body": "## Summary\n\nSecurity remediation addressing Well-Architected Review findings:\n\n- **Backend Input Validation**: Max 500-char description, HTML tag stripping for XSS prevention, UUID v4 validation on taskId, sanitized error responses\n- **API Rate Limiting**: API Gateway throttling (50 req/s steady, 100 burst), write endpoint throttling (20 req/s), Lambda reserved concurrency, AWS WAF WebACL\n- **Frontend Hardening**: Content-Security-Policy meta tag, client-side input length validation\n\n## Test plan\n- [ ] CDK synth passes cleanly\n- [ ] Input validation returns 400 for oversized/malicious input\n- [ ] XSS payloads stripped\n- [ ] Invalid UUID taskIds rejected\n\nGenerated with [Claude Code](https://claude.com/claude-code)"
            }')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" -ge "400" ]; then
            echo "::error::Failed to create PR: $BODY"
            exit 1
          fi
          
          PR_URL=$(echo "$BODY" | jq -r '.html_url // empty')
          echo "PR created: $PR_URL"
